volumes:
  postgres_data:
  redis_data:

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

services:

  django_app:
    build: .
    volumes:
      - .:/app
    ports:
      - 8000:8000
    container_name: django-app
    depends_on:
      - postgres
    command: python manage.py runserver 0.0.0.0:8000 --settings=settings.development

  postgres:
    image: postgres:16.0-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data/

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    networks:
      - internal

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
