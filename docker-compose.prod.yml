x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: carstore-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/usr/share/nginx/static:ro
      - media_data:/usr/share/nginx/media:ro
    networks: [public, internal]
    depends_on:
      django_app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  django_app:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    working_dir: /app/CarStore
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-4}
      --threads 2
      --timeout 90
      --graceful-timeout 30
      --max-requests 1000
      --max-requests-jitter 100
      --access-logfile -
      --error-logfile -
      --log-level ${LOG_LEVEL:-info}
    env_file: [.env]
    volumes:
      - static_data:/app/CarStore/staticfiles
      - media_data:/app/CarStore/media
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      # порт отвечает = gunicorn жив; замените на HTTP-check /health/, когда добавите эндпоинт
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./db/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ApplicationDatabase
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ApplicationDatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - yes
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  celery_worker:
    build: .
    restart: unless-stopped
    working_dir: /app/CarStore
    command: >
      celery -A config worker -l ${LOG_LEVEL:-info}
      --concurrency ${CELERY_CONCURRENCY:-2}
      -n worker@%h
    env_file: [.env]
    networks: [internal]
    depends_on:
      django_app: { condition: service_healthy }
      redis:      { condition: service_healthy }
    logging: *default-logging

  celery_beat:
    build: .
    restart: unless-stopped
    working_dir: /app/CarStore
    command: >
      celery -A config beat -l ${LOG_LEVEL:-info}
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: [.env]
    networks: [internal]
    depends_on:
      django_app: { condition: service_healthy }
      redis:      { condition: service_healthy }
    logging: *default-logging
