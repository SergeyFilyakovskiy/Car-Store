[project]
name = "car-store"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "django>=6.0.4",
    "django-countries>=8.2.0",
    "django-debug-toolbar>=6.3.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.29.0",
    "faker>=40.19.1",
    "gunicorn>=26.0.0",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "redis>=8.0.0",
    "ruff>=0.15.13",
    "django-filter>=25.1",
    "pytest-faker>=2.0.0",
    "pytest-cov>=6.2.0",
    "psycopg2-binary>=2.9.10",
    "drf-spectacular-sidecar>=2026.7.1",
    "factory-boy>=3.3.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["CarStore"]
testpaths = ["CarStore/tests"]
python_files = ["test_*.py", "*_tests.py", "tests.py"]
addopts = "--reuse-db --nomigrations --strict-markers"
markers = [
    "fast: marks tests as fast to run on pre-commit",
    "slow: marks tests as slow"
]
